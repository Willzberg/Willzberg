name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web files
        run: |
          mkdir www
          cp -r index.html manifest.webmanifest sw.js icons images assets www/
      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android sharp
          npx cap init "Kato's Garage" ug.katosgarage.app --web-dir www
          npx cap add android
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json'));c.plugins=Object.assign({},c.plugins,{SystemBars:{style:'DARK'},StatusBar:{style:'DARK'}});fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2))"
          sed -i 's/Theme.AppCompat.DayNight.NoActionBar/Theme.AppCompat.NoActionBar/g' android/app/src/main/res/values/styles.xml
          cat > make-icons.js <<'EOF'
          const sharp = require('sharp');
          const fs = require('fs');
          const sizes = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
          (async () => {
            for (const [d, px] of Object.entries(sizes)) {
              const dir = 'android/app/src/main/res/mipmap-' + d;
              for (const n of ['ic_launcher', 'ic_launcher_round']) {
                for (const f of fs.readdirSync(dir)) {
                  if (f.startsWith(n + '.')) fs.unlinkSync(dir + '/' + f);
                }
                await sharp('icons/app-icon.png').trim({threshold:10}).resize(Math.round(px*0.8),Math.round(px*0.8),{fit:'contain',background:'#fffdf9'}).extend({top:Math.round(px*0.1),bottom:Math.round(px*0.1),left:Math.round(px*0.1),right:Math.round(px*0.1),background:'#fffdf9'}).resize(px,px).png().toFile(dir + '/' + n + '.png');
              }
            }
            fs.rmSync('android/app/src/main/res/mipmap-anydpi-v26', { recursive: true, force: true });
          })();
          EOF
          node make-icons.js
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: katos-garage-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Kato's Garage APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
